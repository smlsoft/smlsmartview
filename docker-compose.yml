services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sml-mis-ai:latest
    container_name: sml-mis-ai
    restart: unless-stopped
    ports:
      - "3618:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET}
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
